version: '3.8'

services:
  minio:
    image: minio/minio
    container_name: minio_storage
    ports:
      - "9000:9000"   # API порт (для підключення з Node.js)
      - "9001:9001"   # Консоль MinIO (адмінка в браузері)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always

volumes:
  minio_data: